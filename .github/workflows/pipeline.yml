name: FIA - GitHub Actions - Databricks

on:
  push:
    branches:
      - main
      - feature/s11-databricks-genie
  workflow_dispatch:

jobs:
  sync-databricks:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_EMAIL: ${{ secrets.DATABRICKS_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks connection
        run: |
          databricks workspace list /
          echo "Conexion con Databricks correcta."

      - name: Verify Databricks Volume
        run: |
          databricks fs ls dbfs:/Volumes/fia_databricks/datos/fia_volume/
          echo "Volume accesible correctamente."

      - name: Read test file from Volume
        run: |
          databricks fs cat dbfs:/Volumes/fia_databricks/datos/fia_volume/datos_prueba.txt

      - name: List Git Folders in Databricks
        run: |
          databricks repos list

      - name: Update Databricks Git Folder
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          REPO_PATH="/Users/${DATABRICKS_EMAIL}/FIA_databricks_2026"

          echo "Actualizando Git Folder..."
          echo "Rama: $BRANCH"
          echo "Ruta: $REPO_PATH"

          databricks repos update "$REPO_PATH" --branch "$BRANCH"

          echo "Git Folder actualizado correctamente."