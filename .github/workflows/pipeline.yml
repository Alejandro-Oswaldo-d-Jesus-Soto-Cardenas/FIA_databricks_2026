name: FIA - GitHub Actions - Databricks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-databricks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks connection
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "=========================================="
          echo "1. Verificando conexión con Databricks"
          echo "=========================================="

          databricks workspace list /

          echo "Conexión con Databricks realizada correctamente."

      - name: Verify Databricks Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "=========================================="
          echo "2. Verificando Databricks Volume"
          echo "=========================================="

          databricks fs ls dbfs:/Volumes/fia_databricks/datos/fia_volume/

          echo "Volume accesible correctamente."

      - name: Read test file from Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "=========================================="
          echo "3. Leyendo archivo desde el Volume"
          echo "=========================================="

          databricks fs cat dbfs:/Volumes/fia_databricks/datos/fia_volume/datos_prueba.txt

          echo "=========================================="
          echo "Prueba completada correctamente."
          echo "=========================================="